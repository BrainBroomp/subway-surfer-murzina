<!doctype html>
<!-- Set lang to the game's language and <title> to its name: the panel's tab shows it. -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Кирпичики на колёсах</title>
    <!-- The runtime's rules: keep this block. #loading covers the page until the first frame is
         drawn with the models the start waits for in place. What is inside it appears only after
         0.3 s, so a quick load shows just its background. The runtime sets --progress on
         #loading, from 0 to 1, as the models load. -->
    <style>html,body{background:#101318;height:100%;margin:0;overflow:hidden}canvas{touch-action:none;width:100%;height:100%;display:block}#ui{pointer-events:none;-webkit-user-select:none;user-select:none;position:fixed;inset:0}#ui .hit{pointer-events:auto}#loading{z-index:1;background:#101318;position:fixed;inset:0}#loading:not(.shown)>*{visibility:hidden!important}</style>
    <!-- The loading screen's look: replace it, and what is inside #loading, with this game's own. -->
    <style>#loading{color:#fff2cb;text-align:center;background:radial-gradient(at 65% 0,#1b626d,#082b36 70%);place-items:center;font-family:system-ui,sans-serif;display:grid}#loading strong{letter-spacing:-.05em;font-size:clamp(24px,5vw,50px);font-weight:950}#loading .bar{background:linear-gradient(#ffd34e,#ffd34e) left / calc(var(--progress,0) * 100%) 100% no-repeat #24606b;border-radius:5px;width:65%;height:6px;margin:22px auto 0}</style>
    <script type="module" crossorigin src="./assets/index-CNd41hK0.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CuG-ym8y.css">
  </head>
  <body>
    <div id="ui"></div>
    <div id="loading"><div><strong>Кирпичики на колёсах</strong><div class="bar"></div></div></div>
    <!-- A three.js game (3D or 2.5D). A pure 2D game loads /core/phaser/runtime.js instead. -->
  </body>
</html>
